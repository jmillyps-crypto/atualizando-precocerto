<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar</title>
</head>
<body>
<header>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-messages">
                {% for category, message in messages %}
                    <div class="flash {{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
</header>


    <main>
        <form action="{{ url_for('editar_insumo', id=insumo[0]) }}" method="post">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" value="{{ insumo[1] }}">


            <label for="unidade">Unidade</label>
            <input type="text" name="unidade" id="unidade" value="{{ insumo[2] }}">


            <label for="custo_unitario">Custo Unitário</label>
            <input type="text" name="custo_unitario" id="custo_unitario" value="{{ insumo[3] }}" step="0.01">

            <label for="estoque">Estoque <span>*</span></label>
            <input type="number" id="estoque" name="estoque" placeholder="Ex.: 2" step="0.01" value="{{ insumo[4] }}" required>

            <button type="submit" class="btn">Salvar</button>
        </form>
    </main>


</body>
</html>
